<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080706">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="AfterShift">
    <title>AfterShift Sleep</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <canvas id="portal" aria-hidden="true"></canvas>
    <div class="glass" aria-hidden="true"></div>

    <main class="app" data-running="false" data-tail="false" data-external-audio="false" data-release-level="0">
      <header class="topbar">
        <button class="icon-button" id="lockButton" type="button" aria-label="Sleep lock" data-tip="Sleep lock">
          <span class="lock-icon" aria-hidden="true"></span>
        </button>
        <div class="brand">
          <strong>AfterShift</strong>
          <span id="sessionReadout">ready</span>
        </div>
        <button class="icon-button install-hidden" id="installButton" type="button" aria-label="Install app" data-tip="Install">
          <span class="install-icon" aria-hidden="true"></span>
        </button>
      </header>

      <section class="stage" aria-live="polite" aria-atomic="true">
        <div class="phase-line" aria-label="Session phase">
          <span id="phaseReadout">Arrive</span>
          <span class="phase-meter"><i id="phaseFill"></i></span>
        </div>

        <section class="feed-shell" aria-label="Sleep feed">
          <div class="feed" id="sleepFeed"></div>
        </section>

        <div class="scene-copy">
          <p id="sceneNumber">01 / 08</p>
          <h1 id="sceneTitle">Velvet Orbit</h1>
          <p id="sceneLine">A slow loop for letting the last part of the shift fall away.</p>
        </div>

        <form class="journal-card" id="journalCard" hidden>
          <div class="journal-kicker">
            <span id="journalNumber">Reflect</span>
            <span id="journalSavedCount">0 saved</span>
          </div>
          <h2 id="journalQuestion">What should be remembered from today?</h2>
          <textarea id="journalAnswer" rows="4" autocomplete="off" placeholder="A few words is enough."></textarea>
          <div class="journal-actions">
            <button class="text-button" id="journalSkip" type="button">Skip</button>
            <button class="text-button is-primary" type="submit">Save</button>
          </div>
        </form>

        <div class="release-row" role="group" aria-label="Release queue">
          <button class="release-button" type="button" data-release="0">
            <span>Shift</span>
            <i></i>
          </button>
          <button class="release-button" type="button" data-release="1">
            <span>Mind</span>
            <i></i>
          </button>
          <button class="release-button" type="button" data-release="2">
            <span>Body</span>
            <i></i>
          </button>
        </div>

        <div class="depth-strip" aria-label="Session progress">
          <span id="progressFill"></span>
        </div>
      </section>

      <nav class="scene-rail" aria-label="Dream scenes" id="sceneRail"></nav>

      <footer class="dock">
        <div class="transport" role="group" aria-label="Playback">
          <button class="icon-button" id="prevButton" type="button" aria-label="Previous scene" data-tip="Previous">
            <span class="chevron left" aria-hidden="true"></span>
          </button>
          <button class="play-button" id="playButton" type="button" aria-label="Start session">
            <span class="play-shape" aria-hidden="true"></span>
          </button>
          <button class="icon-button" id="nextButton" type="button" aria-label="Next scene" data-tip="Next">
            <span class="chevron right" aria-hidden="true"></span>
          </button>
        </div>

        <div class="control-surface">
          <fieldset class="segmented">
            <legend>Length</legend>
            <label><input type="radio" name="duration" value="10"><span>10</span></label>
            <label><input type="radio" name="duration" value="15" checked><span>15</span></label>
            <label><input type="radio" name="duration" value="30"><span>30</span></label>
          </fieldset>

          <label class="select-field">
            <span>Mode</span>
            <select id="modeSelect">
              <option value="hypnosis">Hypnosis</option>
              <option value="rain">Rain room</option>
              <option value="ocean">Ocean drop</option>
              <option value="weightless">Weightless</option>
            </select>
          </label>

          <label class="select-field source-field">
            <span>Audio</span>
            <select id="audioSource">
              <option value="generated">Generated</option>
              <option value="detox">741 Hz</option>
              <option value="deepRest">Deep rest</option>
            </select>
          </label>

          <label class="toggle-field">
            <span>Narration</span>
            <input id="narrationToggle" type="checkbox" checked>
          </label>

          <label class="toggle-field">
            <span>Fadeout</span>
            <input id="fadeToggle" type="checkbox" checked>
          </label>

          <label class="range-field" data-control="voice">
            <span>Voice</span>
            <input id="voiceVolume" type="range" min="0" max="1" step="0.01" value="0.72">
          </label>

          <label class="range-field">
            <span>Sound</span>
            <input id="soundVolume" type="range" min="0" max="1" step="0.01" value="0.64">
          </label>

          <label class="range-field" data-control="pulse">
            <span>Pulse</span>
            <input id="pulseVolume" type="range" min="0" max="1" step="0.01" value="0.36">
          </label>

          <label class="range-field">
            <span>Flow</span>
            <input id="flowSpeed" type="range" min="0.45" max="1.25" step="0.01" value="0.78">
          </label>

          <div class="journal-tools">
            <span id="journalStatus">Journal empty</span>
            <button class="text-button" id="exportJournal" type="button">Export</button>
          </div>
        </div>
      </footer>

      <aside class="youtube-shell" id="youtubeShell" hidden aria-label="YouTube audio player">
        <div id="youtubePlayer"></div>
      </aside>
    </main>
  </body>
</html>
